name: Lean proofs
on:
  push:
    paths:
      - 'Lean Proofs/**'
      - '.github/workflows/lean-proofs.yml'
  pull_request:
    paths:
      - 'Lean Proofs/**'
      - '.github/workflows/lean-proofs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 'Lean Proofs'
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Verify Lean proofs
        run: lake build
